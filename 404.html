<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Страница не найдена — Кабинет здоровья доктора Горшечникова</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <style>
    :root { --ink: #14162b; --muted: #5d6178; --accent: #5952fb; --bg: #ffffff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    main { max-width: 460px; }
    img { width: 96px; height: auto; margin-bottom: 18px; }
    .code { font-size: 64px; font-weight: 700; line-height: 1; color: var(--accent); margin: 0 0 8px; }
    h1 { font-size: 24px; margin: 0 0 10px; }
    p { color: var(--muted); margin: 0 0 24px; }
    nav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    a.btn { display: inline-block; padding: 13px 22px; border-radius: 999px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
    a.btn--ghost { background: transparent; color: var(--ink); border: 1px solid #d6d8e6; }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/logo-ga.svg" alt="" width="96" height="64" />
    <p class="code" aria-hidden="true">404</p>
    <h1>Такой страницы нет</h1>
    <p>Возможно, ссылка устарела или в адресе опечатка. Вся информация о кабинете — на главной странице.</p>
    <nav aria-label="Куда перейти">
      <a class="btn" href="/">На главную</a>
      <a class="btn btn--ghost" href="/#prices">Цены</a>
      <a class="btn btn--ghost" href="tel:+79930440619">+7 993 044-06-19</a>
    </nav>
  </main>
</body>
</html>
